apiVersion: batch/v1
kind: Job
metadata:
  name: btcbot-pipeline-orchestrator
  namespace: btcbot
spec:
  template:
    metadata:
      annotations:
        # Cloud NAT para asegurar que no usemos una IP efímera sino nuestra IP estática
        cloud.google.com/network-tier: "Premium"
    spec:
      serviceAccountName: btcbot-ksa  # Usa la KSA para Workload Identity
      # Quitamos el nodeSelector para GPU ya que no hay GPUs disponibles en europe-southwest1
      containers:
      - name: btcbot-pipeline
        image: europe-southwest1-docker.pkg.dev/lofty-complex-460416-r6/lofty-complex-460416-r6-repo/btcbot-cpu:latest
        command: ["python", "scripts/orchestrate_training.py", "--timesteps", "100000"]
        resources:
          # Omitimos la solicitud de GPU ya que no hay disponibles en esta región
          # En su lugar, solicitamos más CPU y memoria
          requests:
            cpu: "8"
            memory: "16Gi"
          limits:
            cpu: "16"
            memory: "32Gi"
        envFrom:
        - configMapRef:
            name: btcbot-env-vars  # Usa el ConfigMap existente para variables de entorno
      restartPolicy: OnFailure
      # Configuramos un tiempo máximo de ejecución (12 horas)
      activeDeadlineSeconds: 43200
