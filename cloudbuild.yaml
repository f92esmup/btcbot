# Cloud Build configuration file for BTC Trading Bot
# This file defines the CI/CD pipeline that builds and deploys the BTC Trading Bot

# Global timeout for the entire build
timeout: 3600s

# Steps in the build process
steps:
  # Step 1: Run code linting
  - name: 'python:3.10'
    id: 'run-linting'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install flake8 pylint
        echo "Running flake8..."
        flake8 src/ tests/ --max-line-length=100 --statistics
        echo "Running pylint..."
        pylint --disable=C0111,C0103,C0303,W1202 src/ tests/ || true

  # Step 2: Run unit tests with coverage
  - name: 'python:3.10'
    id: 'run-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -r requirements.txt
        pip install pytest pytest-cov
        python -m pytest tests/ -v --cov=src --cov-report=term-missing
    waitFor: ['run-linting']

  # Step 3: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/btc-trading-bot:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/btc-trading-bot:${SHORT_SHA}'
      - '.'
    waitFor: ['run-tests']

  # Step 4: Push Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/btc-trading-bot:${SHORT_SHA}'
    waitFor: ['build-image']

  # Step 5: Also push the latest tag
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest-image'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/btc-trading-bot:latest'
    waitFor: ['push-image']

  # Step 6: Compile Kubeflow Pipeline
  - name: 'python:3.10'
    id: 'compile-pipeline'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install kfp==1.8.22 google-cloud-aiplatform google-cloud-storage
        python pipeline_definition.py \
          --output-file pipeline_${SHORT_SHA}.json \
          --image-uri ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/btc-trading-bot:${SHORT_SHA}
    waitFor: ['push-latest-image']

  # Step 7: Upload pipeline to GCS
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'upload-pipeline'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gsutil cp pipeline_${SHORT_SHA}.json gs://${_ARTIFACTS_BUCKET}/pipelines/btc-trading-bot-pipeline-${SHORT_SHA}.json
    waitFor: ['compile-pipeline']

  # Step 8: Create/update pipeline in Vertex AI
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'create-pipeline'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install google-cloud-pipeline-components google-cloud-aiplatform
        
        # Create or update pipeline in Vertex AI
        python -c "
        from google.cloud import aiplatform
        
        aiplatform.init(project='${PROJECT_ID}', location='${_REGION}')
        
        # Check if pipeline already exists
        try:
            pipeline = aiplatform.PipelineJob.get('btc-trading-bot-pipeline')
            print('Pipeline exists, updating...')
            pipeline_job = aiplatform.PipelineJob(
                display_name='btc-trading-bot-pipeline',
                template_path='gs://${_ARTIFACTS_BUCKET}/pipelines/btc-trading-bot-pipeline-${SHORT_SHA}.json',
                parameter_values={
                    'project_id': '${PROJECT_ID}',
                    'region': '${_REGION}',
                    'gcs_bucket': '${_ARTIFACTS_BUCKET}'
                },
                enable_caching=True
            )
        except Exception as e:
            print(f'Pipeline does not exist or error: {e}')
            print('Creating new pipeline...')
            pipeline_job = aiplatform.PipelineJob(
                display_name='btc-trading-bot-pipeline',
                template_path='gs://${_ARTIFACTS_BUCKET}/pipelines/btc-trading-bot-pipeline-${SHORT_SHA}.json',
                parameter_values={
                    'project_id': '${PROJECT_ID}',
                    'region': '${_REGION}',
                    'gcs_bucket': '${_ARTIFACTS_BUCKET}'
                },
                enable_caching=True
            )
        
        # Submit the pipeline job
        pipeline_job.submit(service_account='${_SERVICE_ACCOUNT_EMAIL}')
        print(f'Pipeline job submitted: {pipeline_job.resource_name}')
        "
    waitFor: ['upload-pipeline']

  # Step 9 (Optional): Run a smoke test with minimal parameters
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke-test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_RUN_SMOKE_TEST}" = "true" ]; then
          echo "Running smoke test pipeline..."
          pip install google-cloud-aiplatform
          
          python -c "
          from google.cloud import aiplatform
          
          aiplatform.init(project='${PROJECT_ID}', location='${_REGION}')
          
          # Create a smoke test pipeline with minimal parameters
          pipeline_job = aiplatform.PipelineJob(
              display_name='btc-trading-bot-pipeline-smoke-test-${SHORT_SHA}',
              template_path='gs://${_ARTIFACTS_BUCKET}/pipelines/btc-trading-bot-pipeline-${SHORT_SHA}.json',
              parameter_values={
                  'project_id': '${PROJECT_ID}',
                  'region': '${_REGION}',
                  'gcs_bucket': '${_ARTIFACTS_BUCKET}',
                  'download_start_date': '2022-01-01',
                  'download_end_date': '2022-01-31',
                  'training_steps': '1000',
                  'n_backtest_episodes': '1'
              },
              enable_caching=True
          )
          
          # Submit the pipeline job
          pipeline_job.submit(service_account='${_SERVICE_ACCOUNT_EMAIL}')
          print(f'Smoke test pipeline job submitted: {pipeline_job.resource_name}')
          "
        else
          echo "Skipping smoke test..."
        fi
    waitFor: ['create-pipeline']

# Images to be pushed to Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/btc-trading-bot:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/btc-trading-bot:${SHORT_SHA}'

# Substitution variables (configured in Cloud Build trigger)
substitutions:
  _REGION: 'us-central1'                        # GCP region
  _REPO_NAME: 'btc-trading-bot'                 # Artifact Registry repository name
  _ARTIFACTS_BUCKET: '${PROJECT_ID}-btc-artifacts' # GCS bucket for artifacts
  _RAW_DATA_BUCKET: '${PROJECT_ID}-btc-raw-data'   # GCS bucket for raw data
  _SERVICE_ACCOUNT_EMAIL: 'btc-trading-bot-sa@${PROJECT_ID}.iam.gserviceaccount.com' # Service account email
  _RUN_SMOKE_TEST: 'false'                      # Whether to run a smoke test

# Options for the build
options:
  machineType: 'E2_HIGHCPU_8'     # Use a high-CPU machine for faster builds
  diskSizeGb: '100'               # Allocate 100GB disk space for the build
  dynamic_substitutions: true     # Enable dynamic variable substitution