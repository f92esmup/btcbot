# cloudbuild.yaml
substitutions:
  # --- GCP Configuration ---
  _GCP_PROJECT_ID: "${PROJECT_ID}" # Automatically populated by Cloud Build
  _GCP_REGION: "europe-southwest1"
  _ARTIFACT_REGISTRY_LOCATION: "europe-southwest1" # Usually same as region
  _ARTIFACT_REGISTRY_REPO: " lofty-complex-460416-r6-repo" # Your Artifact Registry repo name

  # --- Image Configuration ---
  _CPU_IMAGE_NAME: "btcbot-cpu"
  _GPU_IMAGE_NAME: "btcbot-gpu"

  # --- GKE Configuration ---
  _GKE_CLUSTER_NAME: "btcbot-autopilot-cluster"
  _K8S_NAMESPACE: "btcbot"
  _K8S_SECRET_NAME: "btcbot-env-vars"
  _K8S_SERVICE_ACCOUNT: "default" # Or your specific KSA for the bot

  # --- Environment Variables for K8s Secret (pass these via --substitutions in `gcloud builds submit`) ---
  # These are examples; you'll need to pass the actual values when running the build.
  # It's more secure to manage these as secret build arguments or from a secure source.
  _SECRET_GCS_BUCKET_NAME: "lofty-complex-460416-r6" # Example: pass actual value during build
  _SECRET_BIGQUERY_LOG_DATASET_ID: "btcbot_logs" # Example
  _SECRET_USE_TESTNET: "true" # Example
  _SECRET_LOG_LEVEL: "INFO" # Example

steps:
# ------------------------------------------------------------------------------------
# Step 1: Build CPU Docker Image
# ------------------------------------------------------------------------------------
- name: "gcr.io/cloud-builders/docker"
  id: "build-cpu-image"
  args: [
    "build",
    "-t", "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_CPU_IMAGE_NAME}:${SHORT_SHA}",
    "-t", "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_CPU_IMAGE_NAME}:latest",
    "-f", "Dockerfile.cpu",
    "."
  ]

# ------------------------------------------------------------------------------------
# Step 2: Build GPU Docker Image
# ------------------------------------------------------------------------------------
- name: "gcr.io/cloud-builders/docker"
  id: "build-gpu-image"
  args: [
    "build",
    "-t", "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_GPU_IMAGE_NAME}:${SHORT_SHA}",
    "-t", "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_GPU_IMAGE_NAME}:latest",
    "-f", "Dockerfile.gpu",
    "."
  ]

# ------------------------------------------------------------------------------------
# Step 3: Push Docker Images to Artifact Registry
# ------------------------------------------------------------------------------------
- name: "gcr.io/cloud-builders/docker"
  id: "push-images"
  args: ["push", "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_CPU_IMAGE_NAME}"]
  waitFor: ["build-cpu-image"]
- name: "gcr.io/cloud-builders/docker"
  args: ["push", "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_GPU_IMAGE_NAME}"]
  waitFor: ["build-gpu-image"]

# ------------------------------------------------------------------------------------
# Step 4: Create/Update GKE Autopilot Cluster
# ------------------------------------------------------------------------------------
- name: "gcr.io/google-cloud-sdk/gcloud"
  id: "setup-gke-cluster"
  entrypoint: "bash"
  args:
  - "-c"
  - |
    gcloud container clusters describe ${_GKE_CLUSTER_NAME} --region ${_GCP_REGION} --project ${_GCP_PROJECT_ID} ||     gcloud container clusters create-auto ${_GKE_CLUSTER_NAME}       --region ${_GCP_REGION}       --project ${_GCP_PROJECT_ID}       --enable-shielded-nodes       --release-channel "regular"
  waitFor: ["push-images"] # Ensure images are pushed before cluster might need them (though not directly)

# ------------------------------------------------------------------------------------
# Step 5: Get GKE Credentials
# ------------------------------------------------------------------------------------
- name: "gcr.io/google-cloud-sdk/gcloud"
  id: "get-gke-credentials"
  args:
  - "container"
  - "clusters"
  - "get-credentials"
  - "${_GKE_CLUSTER_NAME}"
  - "--region"
  - "${_GCP_REGION}"
  - "--project"
  - "${_GCP_PROJECT_ID}"
  waitFor: ["setup-gke-cluster"]

# ------------------------------------------------------------------------------------
# Step 6: Create Kubernetes Namespace (if not exists)
# ------------------------------------------------------------------------------------
- name: "gcr.io/cloud-builders/kubectl"
  id: "create-namespace"
  args:
  - "create"
  - "namespace"
  - "${_K8S_NAMESPACE}"
  - "--dry-run=client"
  - "-o"
  - "yaml"
  - "|"
  - "kubectl"
  - "apply"
  - "-f"
  - "-"
  env:
  - "CLOUDSDK_CORE_PROJECT=${_GCP_PROJECT_ID}"
  - "CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER_NAME}"
  - "CLOUDSDK_COMPUTE_REGION=${_GCP_REGION}"
  waitFor: ["get-gke-credentials"]

# ------------------------------------------------------------------------------------
# Step 7: Create/Update Kubernetes Secret for Environment Variables
# This method uses --from-literal for each env var.
# Assumes substitutions like _SECRET_GCS_BUCKET_NAME are passed to `gcloud builds submit`.
# ------------------------------------------------------------------------------------
- name: "gcr.io/cloud-builders/kubectl"
  id: "create-update-secret"
  entrypoint: "bash"
  args:
  - "-c"
  - |
    kubectl create secret generic ${_K8S_SECRET_NAME} --namespace ${_K8S_NAMESPACE}       --from-literal=GCP_PROJECT_ID=${_GCP_PROJECT_ID}       --from-literal=GCS_BUCKET_NAME=${_SECRET_GCS_BUCKET_NAME}       --from-literal=GCP_REGION=${_GCP_REGION}       --from-literal=BIGQUERY_LOG_DATASET_ID=${_SECRET_BIGQUERY_LOG_DATASET_ID}       --from-literal=USE_TESTNET=${_SECRET_USE_TESTNET}       --from-literal=LOG_LEVEL=${_SECRET_LOG_LEVEL}       --from-literal=PYTHONUNBUFFERED="1"       --dry-run=client -o yaml | kubectl apply -f -
  env:
  - "CLOUDSDK_CORE_PROJECT=${_GCP_PROJECT_ID}"
  - "CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER_NAME}"
  - "CLOUDSDK_COMPUTE_REGION=${_GCP_REGION}"
  waitFor: ["create-namespace"]

# ------------------------------------------------------------------------------------
# Step 8: Deploy/Update Kubernetes Jobs for ML Pipeline
# Substitute image URIs in the job manifests
# ------------------------------------------------------------------------------------
- name: "gcr.io/google-cloud-sdk/gcloud"
  id: "deploy-ml-jobs"
  entrypoint: "bash"
  args:
  - "-c"
  - |
    # Substitute image URIs in job manifests
    sed "s|YOUR_GCP_PROJECT_ID|${_GCP_PROJECT_ID}|g; s|YOUR_ARTIFACT_REGISTRY_REPO|${_ARTIFACT_REGISTRY_REPO}|g; s|YOUR_CPU_IMAGE_NAME:latest|${_CPU_IMAGE_NAME}:${SHORT_SHA}|g" k8s/data-acquisition-job.yaml > k8s/data-acquisition-job-processed.yaml
    sed "s|YOUR_GCP_PROJECT_ID|${_GCP_PROJECT_ID}|g; s|YOUR_ARTIFACT_REGISTRY_REPO|${_ARTIFACT_REGISTRY_REPO}|g; s|YOUR_CPU_IMAGE_NAME:latest|${_CPU_IMAGE_NAME}:${SHORT_SHA}|g" k8s/data-preprocessing-job.yaml > k8s/data-preprocessing-job-processed.yaml
    sed "s|YOUR_GCP_PROJECT_ID|${_GCP_PROJECT_ID}|g; s|YOUR_ARTIFACT_REGISTRY_REPO|${_ARTIFACT_REGISTRY_REPO}|g; s|YOUR_GPU_IMAGE_NAME:latest|${_GPU_IMAGE_NAME}:${SHORT_SHA}|g" k8s/model-training-job.yaml > k8s/model-training-job-processed.yaml
    
    # Apply/Update the ML pipeline jobs
    kubectl apply -f k8s/data-acquisition-job-processed.yaml --namespace ${_K8S_NAMESPACE}
    # Note: preprocessing and training jobs are applied on-demand by the orchestration script
    
    echo "✅ ML pipeline jobs configurados correctamente"
  env:
  - "CLOUDSDK_CORE_PROJECT=${_GCP_PROJECT_ID}"
  - "CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER_NAME}"
  - "CLOUDSDK_COMPUTE_REGION=${_GCP_REGION}"
  waitFor: ["get-gke-credentials", "create-update-secret"] # Depends on GKE setup and secret

# ------------------------------------------------------------------------------------
# Step 9: Deploy/Update Live Trader on GKE
# Substitute image URI in the deployment manifest
# ------------------------------------------------------------------------------------
- name: "gcr.io/google-cloud-sdk/gcloud"
  id: "deploy-live-trader"
  entrypoint: "bash"
  args:
  - "-c"
  - |
    # Substitute the image URI in the deployment YAML
    # Using a temporary file for substitution
    sed "s|image: \".*\"|image: \"${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_CPU_IMAGE_NAME}:${SHORT_SHA}\"|g" k8s/live-trader-deployment.yaml > k8s/live-trader-deployment-processed.yaml
    
    kubectl apply -f k8s/live-trader-deployment-processed.yaml --namespace ${_K8S_NAMESPACE}
  env:
  - "CLOUDSDK_CORE_PROJECT=${_GCP_PROJECT_ID}"
  - "CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER_NAME}"
  - "CLOUDSDK_COMPUTE_REGION=${_GCP_REGION}"
  waitFor: ["deploy-ml-jobs"] # Deploy live trader after ML jobs are configured

# ------------------------------------------------------------------------------------
# Specify images to be pushed by Cloud Build (if not using explicit push steps)
# This is an alternative to explicit 'docker push' steps if all images are built first.
# However, explicit push steps (like Step 3) are clearer.
# ------------------------------------------------------------------------------------
images:
- "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_CPU_IMAGE_NAME}:${SHORT_SHA}"
- "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_CPU_IMAGE_NAME}:latest"
- "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_GPU_IMAGE_NAME}:${SHORT_SHA}"
- "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_GPU_IMAGE_NAME}:latest"

# Optional: Define default timeout for the build
timeout: "7200s" # 2 hours

# Optional: Define machine type for Cloud Build workers (e.g., for faster builds)
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100

logsBucket: 'gs://lofty-complex-460416-r6_cloudbuild'