# Cloud Build para construir imágenes Docker de btcbot (CPU y GPU)
# --------------------------------------------------------------
# CONFIGURACIÓN COMPLETA: Este archivo ya está configurado con los valores correctos
# para tu proyecto bitcoin-460320 y repositorio bitcoin-460320-repo.
#
# Para ejecutar el build:
# gcloud builds submit --config=cloudbuild.yaml
#
# También puedes configurar un trigger en:
# https://console.cloud.google.com/cloud-build/triggers
#
# NOTA SOBRE VARIABLES DE ENTORNO:
# Al ejecutar el contenedor, debes proporcionar las variables de entorno necesarias:
#   - GCP_PROJECT_ID: ID de tu proyecto en GCP (bitcoin-460320)
#   - GCS_BUCKET_NAME: Nombre del bucket de almacenamiento (bitcoin-460320_data)
#   - GCP_REGION: Región de GCP (europe-southwest1)
#
# Ejemplo de comando para ejecutar:
# docker run -e GCP_PROJECT_ID="bitcoin-460320" -e GCS_BUCKET_NAME="bitcoin-460320_data" \
#   europe-southwest1-docker.pkg.dev/bitcoin-460320/bitcoin-460320-repo/btcbot:cpu-latest \
#   python scripts/test_environment.py

steps:
# Construir la imagen con soporte GPU
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', 
         '-t', '${_ARTIFACT_REGISTRY}/${_PROJECT_ID}/${_REPOSITORY_NAME}/btcbot:gpu-${_VERSION}', 
         '-t', '${_ARTIFACT_REGISTRY}/${_PROJECT_ID}/${_REPOSITORY_NAME}/btcbot:gpu-latest',
         '-f', 'Dockerfile.gpu', 
         '.']

# Construir la imagen versión CPU
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', 
         '-t', '${_ARTIFACT_REGISTRY}/${_PROJECT_ID}/${_REPOSITORY_NAME}/btcbot:cpu-${_VERSION}', 
         '-t', '${_ARTIFACT_REGISTRY}/${_PROJECT_ID}/${_REPOSITORY_NAME}/btcbot:cpu-latest',
         '-f', 'Dockerfile.cpu', 
         '.']

# Publicar imagen GPU en Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_ARTIFACT_REGISTRY}/${_PROJECT_ID}/${_REPOSITORY_NAME}/btcbot:gpu-${_VERSION}']

# Publicar imagen GPU latest en Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_ARTIFACT_REGISTRY}/${_PROJECT_ID}/${_REPOSITORY_NAME}/btcbot:gpu-latest']

# Publicar imagen CPU en Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_ARTIFACT_REGISTRY}/${_PROJECT_ID}/${_REPOSITORY_NAME}/btcbot:cpu-${_VERSION}']

# Publicar imagen CPU latest en Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_ARTIFACT_REGISTRY}/${_PROJECT_ID}/${_REPOSITORY_NAME}/btcbot:cpu-latest']

logsBucket: 'gs://bitcoin-460320_cloudbuild' # Reemplaza con el nombre de tu bucket

substitutions:
  # Valores configurados para tu proyecto y repositorio
  # -------------------------------------------
  _ARTIFACT_REGISTRY: 'europe-southwest1-docker.pkg.dev'  # URL del registry (región europe-southwest1)
  _PROJECT_ID: 'bitcoin-460320'                           # Tu ID de proyecto en GCP 
  _REPOSITORY_NAME: 'bitcoin-460320-repo'                 # Nombre del repositorio en Artifact Registry
  _VERSION: '1.0.0'                                       # Versión de esta build

# Configuración de tiempo y recursos
timeout: 10800s  # 3 horas para completar la construcción
options:
  machineType: 'E2_HIGHCPU_8'  # 8 CPUs virtuales, buena opción para construcciones de imágenes con ML
  diskSizeGb: 100  # Aumentamos el tamaño del disco para evitar problemas de espacio
