# cloudbuild.yaml

steps:
# Construir la imagen con soporte GPU
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t', '${_ARTIFACT_REGISTRY}/${_PROJECT_ID}/${_REPOSITORY_NAME}/btcbot-train-gpu:${_VERSION}',
    '-t', '${_ARTIFACT_REGISTRY}/${_PROJECT_ID}/${_REPOSITORY_NAME}/btcbot-train-gpu:latest',
    '-f', 'Dockerfile.train',  # Usamos el Dockerfile.train que creamos
    '.'
  ]
  timeout: 3600s # Tiempo límite para este paso (ej. 1 hora)

# Publicar imagen GPU con versión específica en Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_ARTIFACT_REGISTRY}/${_PROJECT_ID}/${_REPOSITORY_NAME}/btcbot-train-gpu:${_VERSION}']

# Publicar imagen GPU 'latest' en Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_ARTIFACT_REGISTRY}/${_PROJECT_ID}/${_REPOSITORY_NAME}/btcbot-train-gpu:latest']

# Guardar logs de construcción en un bucket de GCS
logsBucket: 'gs://btcbotbucket_cloudbuild' # Reemplaza con el nombre de tu bucket

# Variables de sustitución
substitutions:
  _ARTIFACT_REGISTRY: 'europe-southwest1-docker.pkg.dev' # URL de tu Artifact Registry
  _PROJECT_ID: 'btcbot-461022'                           # Tu Project ID de GCP
  _REPOSITORY_NAME: 'btcbotrepo'                         # Nombre de tu repositorio en Artifact Registry
  _VERSION: '1.0.0'                                      # Versión de la imagen

# Configuración global de tiempo y recursos para la construcción
timeout: 7200s # Tiempo límite total para todos los pasos (ej. 2 horas)
options:
  # Para construcciones GPU, necesitas especificar un tipo de máquina con GPU.
  # Esto se configura a nivel de pool de workers privados o usando machineType para workers por defecto.
  # Si usas workers por defecto, las GPUs no están disponibles directamente en 'machineType'.
  # Para usar GPUs con Cloud Build, generalmente necesitas un Private Pool configurado con máquinas GPU.
  # Si no tienes un private pool con GPU, esta construcción solo creará la imagen,
  # pero el proceso de build en sí mismo no usará una GPU para acelerar la construcción de la imagen.
  # La imagen resultante SÍ tendrá soporte GPU para ser ejecutada en un entorno con GPU.
  machineType: 'E2_HIGHCPU_32' # Tipo de máquina más potente para la construcción.
  diskSizeGb: 150             # Tamaño del disco para la VM de construcción.
