# btcbot-deployment.template.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: btcbot-live-trader
  labels:
    app: btcbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: btcbot-trader
  template:
    metadata:
      labels:
        app: btcbot-trader
    spec:
      # Si usas Workload Identity, especifica aquí tu Kubernetes Service Account (KSA)
      # serviceAccountName: tu-ksa-nombre
      containers:
      - name: btcbot-runner
        image: europe-southwest1-docker.pkg.dev/lofty-complex-460416-r6/lofty-complex-460416-r6-repo/btcbot-cpu:latest # Asegúrate que esta es tu imagen correcta
        command: ["python", "scripts/run_live_trader.py"]
        args: ["--config_path", "src/config.yaml"]
        env:
        # --- Variables de Configuración de GCP ---
        - name: GCP_PROJECT_ID
          value: "${_GCP_PROJECT_ID}"
        - name: GCS_BUCKET_NAME
          value: "${_GCS_BUCKET_NAME}"
        - name: GCP_REGION
          value: "${_GCP_REGION}"

        # --- Variables de Configuración del Bot ---
        - name: LIVE_TRADING_MODE # "TESTNET" o "REAL"
          value: "${_LIVE_TRADING_MODE}"

        # --- Nombres de los Secretos en Google Cloud Secret Manager ---
        # Tu código usará estos NOMBRES para buscar los valores reales en Secret Manager
        - name: SECRET_NAME_BINANCE_API_KEY_FUTURES
          value: "BINANCE_API_KEY_FUTURES" # Este es el nombre del secreto, no el valor
        - name: SECRET_NAME_BINANCE_API_SECRET_FUTURES
          value: "BINANCE_API_SECRET_FUTURES" # Este es el nombre del secreto, no el valor
        - name: SECRET_NAME_TESTNET_BINANCE_API_KEY_FUTURES
          value: "TESTNET_BINANCE_API_KEY_FUTURES" # Este es el nombre del secreto, no el valor
        - name: SECRET_NAME_TESTNET_BINANCE_API_SECRET_FUTURES
          value: "TESTNET_BINANCE_API_SECRET_FUTURES" # Este es el nombre del secreto, no el valor
        resources:
          requests:
            cpu: "200m"      # 0.2 CPU cores (mínimo requerido en Autopilot)
            memory: "512Mi"  # 512MB de memoria (reducido del valor predeterminado)
          limits:
            cpu: "500m"      # Máximo 0.5 CPU cores
            memory: "1Gi"    # Máximo 1GB de memoria

# --- SECCIÓN DE SUSTITUCIONES Y VALORES DE REFERENCIA ---
# Esta sección será procesada por scripts de sustitución o por kustomize.
# No incluyas esta sección tal cual en el archivo que aplicas con kubectl.
#
# Valores de sustitución por defecto:
# NOTA: Estos valores se pueden sobrescribir por comandos de línea o variables de entorno
substitutions:
  _GCP_PROJECT_ID: "lofty-complex-460416-r6"               # ID de tu proyecto en GCP 
  _GCS_BUCKET_NAME: "lofty-complex-460416-r6"              # Nombre del bucket de almacenamiento
  _GCP_REGION: "europe-southwest1"                         # Región de GCP
  _LIVE_TRADING_MODE: "TESTNET"                           # "TESTNET" o "REAL"
  
# Mapeo de los placeholders a las sustituciones:
# __GCP_PROJECT_ID_VALUE__ -> ${_GCP_PROJECT_ID}
# __GCS_BUCKET_NAME_VALUE__ -> ${_GCS_BUCKET_NAME}
# __GCP_REGION_VALUE__ -> ${_GCP_REGION}
# __LIVE_TRADING_MODE_VALUE__ -> ${_LIVE_TRADING_MODE}

# ==============================================================================
# INSTRUCCIONES PARA DESPLEGAR, ACTUALIZAR Y DETENER EL BOT EN KUBERNETES
# ==============================================================================
#
# === DESPLEGAR EL BOT EN KUBERNETES ===
#
# 1. Generar el archivo de despliegue con las sustituciones:
#    cp /Users/f92esmup/btcbot/btcbot-deployment.template.yaml /Users/f92esmup/btcbot/btcbot-deployment.yaml
#    sed -i '' "s|\${_GCP_PROJECT_ID}|lofty-complex-460416-r6|g" /Users/f92esmup/btcbot/btcbot-deployment.yaml
#    sed -i '' "s|\${_GCS_BUCKET_NAME}|lofty-complex-460416-r6|g" /Users/f92esmup/btcbot/btcbot-deployment.yaml
#    sed -i '' "s|\${_GCP_REGION}|europe-southwest1|g" /Users/f92esmup/btcbot/btcbot-deployment.yaml
#    sed -i '' "s|\${_LIVE_TRADING_MODE}|TESTNET|g" /Users/f92esmup/btcbot/btcbot-deployment.yaml
#    sed -i '' '/# --- SECCIÓN DE SUSTITUCIONES Y VALORES DE REFERENCIA ---/,/# ==============================================================================$/d' /Users/f92esmup/btcbot/btcbot-deployment.yaml
#
# 2. Si necesitas conectarte a un clúster GKE específico:
#    gcloud container clusters get-credentials btcbot-cluster --region europe-southwest1 --project lofty-complex-460416-r6
#
# 3. Aplicar el archivo de despliegue:
#    kubectl apply -f /Users/f92esmup/btcbot/btcbot-deployment.yaml
#
# 4. Verificar el despliegue:
#    kubectl get deployments
#    kubectl get pods
#
# === ACTUALIZAR LA CONFIGURACIÓN DEL BOT (p.ej. cambiar a REAL) ===
#
# 1. Editar la plantilla para cambiar valores, o simplemente modificar la sustitución:
#    sed -i '' "s|\${_LIVE_TRADING_MODE}|REAL|g" /Users/f92esmup/btcbot/btcbot-deployment.yaml
#
# 2. Aplicar el archivo actualizado:
#    kubectl apply -f /Users/f92esmup/btcbot/btcbot-deployment.yaml
#
# === MONITOREAR EL BOT ===
#
# 1. Ver los logs del bot (reemplaza [pod-name] con el nombre actual del pod):
#    kubectl get pods  # Para obtener el nombre del pod
#    kubectl logs -f [pod-name]
#
# 2. Ver detalles del pod:
#    kubectl describe pod [pod-name]
#
# === DETENER EL BOT ===
#
# 1. Eliminar el despliegue:
#    kubectl delete deployment btcbot-live-trader
#
# === SOLUCIÓN DE PROBLEMAS ===
#
# 1. Si tienes problemas de cuota al desplegar:
#    - Verifica que los recursos solicitados no sean demasiado altos
#    - Puedes modificar los recursos en la sección 'resources' del template
#
# 2. Si no puedes conectarte al clúster:
#    - Verifica tu conexión VPN si es necesaria
#    - Actualiza tus credenciales de GKE con el comando en paso 2 del despliegue
#
# 3. Para verificar el contexto de kubectl actual:
#    kubectl config current-context
#
# 4. Para verificar la información del clúster:
#    kubectl cluster-info
