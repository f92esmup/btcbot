# Configuración para el bot de trading de Bitcoin
# Parámetros de la API de Binance
api:
  call_limit: 1000  # Número máximo de velas por llamada
  max_retries: 3    # Número máximo de reintentos en caso de error
  retry_delay: 1    # Segundos entre reintentos
  timeout: 10       # Timeout para las peticiones en segundos

# Configuración de trading
trading:
  testnet: true  # Si está en modo testnet (true) o producción (false)

# Configuración de Google Cloud
gcp:
  project_id: "btcbot-461022"  # Tu project ID de Google Cloud
  storage:
    bucket_name: "btcbot-training-ew4"  # Nombre del bucket para almacenar modelos
    scaler_blob_name: "scaler.pkl"  # Nombre del archivo scaler en GCS

# Configuración de datos
data:
  # Columnas OHLCV a mantener
  columns:
    - "Open"
    - "High" 
    - "Low"
    - "Close"
    - "Volume"
  
  # Configuración de tipos de datos para optimizar RAM
  dtypes:
    Open: "float32"
    High: "float32"
    Low: "float32" 
    Close: "float32"
    Volume: "float32"

# Configuración de zona horaria
timezone:
  target: "Europe/Madrid"  # UTC+1/UTC+2
  source: "UTC"

# Configuración de interpolación
interpolation:
  method: "linear"  # Método de interpolación para NaNs
  limit_direction: "both"  # Dirección para fill

# Configuración de normalización
normalization:
  scaler_type: "MinMaxScaler"  # Tipo de escalador a usar
  feature_range: [0, 1]        # Rango de normalización
  scaler_path: "models/scaler.pkl"  # Ruta donde guardar el scaler (modo local)
  storage_mode: "gcp"        # Modo de almacenamiento: "local" o "gcp"

# Configuración de indicadores técnicos
indicators:
  # Indicadores de tendencia
  trend:
    ema_20:
      period: 20
      enabled: true
    ema_50:
      period: 50
      enabled: true
    adx:
      period: 14
      enabled: true
  
  # Indicadores de momento
  momentum:
    rsi:
      period: 14
      enabled: true
    stoch:
      k_period: 14
      d_period: 3
      smooth_k: 3
      enabled: true
  
  # Indicadores de volatilidad
  volatility:
    atr:
      period: 14
      enabled: true
  
  # Indicadores de volumen
  volume:
    obv:
      enabled: true

# Configuración del entorno de trading (Environment)
environment:
  # Capital y riesgo
  capital_inicial: 10000.0  # Capital inicial en USDT
  apalancamiento: 10        # Apalancamiento máximo (ej. 10x)
  porcentaje_max_inversion_por_trade: 0.05  # 5% del balance como margen por trade
  max_drawdown_configurado_cuenta: 0.5      # 50% de drawdown máximo antes de terminated
  
  # Costos de trading
  comision_taker_porcentaje: 0.0004    # 0.04% sobre valor nocional
  slippage_porcentaje: 0.00005         # 0.005% sobre precio de ejecución
  
  # Observación
  ventana_observacion_size: 24         # Número de velas pasadas en la observación (L)
  
  # Normalización de portfolio para observación
  max_pasos_en_posicion: 100          # Máximo esperado de pasos en una posición
  min_clip_pnl_roe: -0.50             # ROE mínimo para clip (-50%)
  max_clip_pnl_roe: 0.50              # ROE máximo para clip (+50%)
  
  # Zona muerta para acciones
  zona_muerta_mantener: 0.15          # ±0.15 para mantener posición
  
  # Función de recompensa
  peso_recompensa_paso: 1.0           # Peso para recompensa por paso
  peso_recompensa_cierre: 1.0         # Peso para recompensa al cerrar operación
  peso_recompensa_episodio: 0.0       # Peso para Sortino (0 = no se usa por ahora)
  usar_log1p_en_pnl: true            # Si aplicar log1p al PNL para suavizar
  
  # Condiciones de finalización
  usar_max_pasos_episodio: true       # Si limitar pasos por episodio
  max_pasos_episodio: 1000           # Máximo pasos por episodio (si se usa)