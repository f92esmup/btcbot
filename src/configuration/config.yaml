# Configuración para el bot de trading de Bitcoin
# Parámetros de la API de Binance
api:
  call_limit: 1000  # Número máximo de velas por llamada
  max_retries: 3    # Número máximo de reintentos en caso de error
  retry_delay: 1    # Segundos entre reintentos
  timeout: 10       # Timeout para las peticiones en segundos

# Configuración de trading
trading:
  testnet: true  # Si está en modo testnet (true) o producción (false)

# Configuración de Google Cloud
gcp:
  project_id: "btcbot-461022"  # Tu project ID de Google Cloud
  storage:
    bucket_name: "btcbot-training-ew4"  # Nombre del bucket para almacenar modelos
    scaler_blob_name: "scaler.pkl"  # Nombre del archivo scaler en GCS
    price_scaler_blob_name: "price_scaler.pkl"  # Nombre del archivo price_scaler en GCS

# Configuración de datos
data:
  # Columnas OHLCV a mantener
  columns:
    - "Open"
    - "High" 
    - "Low"
    - "Close"
    - "Volume"
  
  # Configuración de tipos de datos para optimizar RAM
  dtypes:
    Open: "float32"
    High: "float32"
    Low: "float32" 
    Close: "float32"
    Volume: "float32"

# Configuración de zona horaria
timezone:
  target: "Europe/Madrid"  # UTC+1/UTC+2
  source: "UTC"

# Configuración de interpolación
interpolation:
  method: "linear"  # Método de interpolación para NaNs
  limit_direction: "both"  # Dirección para fill

# Configuración de normalización
normalization:
  scaler_type: "MinMaxScaler"  # Tipo de escalador a usar
  feature_range: [0, 1]        # Rango de normalización
  scaler_path: "models/scaler.pkl"  # Ruta donde guardar el scaler (modo local)
  storage_mode: "gcp"        # Modo de almacenamiento: "local" o "gcp"

# Configuración para Vertex AI TensorBoard
tensorboard_vertex_ai:
  instance_name: "8452737531086110720" # Nueva instancia de TensorBoard creada
  experiment_name: "BTCBot Trading Experiment" # Nuevo experimento creado
  location: "europe-west4" # La región de tu instancia de TensorBoard

# Configuración de indicadores técnicos
indicators:
  # Indicadores de tendencia
  trend:
    ema_20:
      period: 20
      enabled: true
    ema_50:
      period: 50
      enabled: true
    adx:
      period: 14
      enabled: true
  
  # Indicadores de momento
  momentum:
    rsi:
      period: 14
      enabled: true
    stoch:
      k_period: 14
      d_period: 3
      smooth_k: 3
      enabled: true
  
  # Indicadores de volatilidad
  volatility:
    atr:
      period: 14
      enabled: true
  
  # Indicadores de volumen
  volume:
    obv:
      enabled: true

# Configuración del entorno de trading (Environment)
environment:
  # Capital y riesgo
  capital_inicial: 10000.0  # Capital inicial en USDT
  apalancamiento: 10        # Apalancamiento máximo (ej. 10x)
  porcentaje_max_inversion_por_trade: 0.05  # 5% del balance como margen por trade
  max_drawdown_configurado_cuenta: 0.5      # 50% de drawdown máximo antes de terminated
  
  # Costos de trading
  comision_taker_porcentaje: 0.0004    # 0.04% sobre valor nocional
  slippage_porcentaje: 0.00005         # 0.005% sobre precio de ejecución
  
  # Observación
  ventana_observacion_size: 24         # Número de velas pasadas en la observación (L)
  
  # Normalización de portfolio para observación
  max_pasos_en_posicion: 100          # Máximo esperado de pasos en una posición
  min_clip_pnl_roe: -1.0             # ROE mínimo para clip (-100%)
  max_clip_pnl_roe: 1.0              # ROE máximo para clip (+100%)

  # Zona muerta para acciones
  zona_muerta_mantener: 0.15          # ±0.15 para mantener posición
  
  # Función de recompensa
  peso_recompensa_paso: 1.0           # Peso para recompensa por paso
  peso_recompensa_cierre: 1.0         # Peso para recompensa al cerrar operación
  peso_recompensa_episodio: 0.0       # Peso para Sortino (0 = no se usa por ahora)
  usar_log1p_en_pnl: false            # Si aplicar log1p al PNL para suavizar, \ 
  # RECOMENDADO EN false, ya que se ha incorporado normalización de recompensas en el agente y puede interferir (DEPRECIATED)

  # Condiciones de finalización
  usar_max_pasos_episodio: false      # Si limitar pasos por episodio
  max_pasos_episodio: 2000           # Máximo pasos por episodio (si se usa)

# Configuración del Agente SAC con Transformer
agent:
  algorithm: "SAC" # Confirmando el algoritmo
  
  # --- Parámetros del Replay Buffer y Entrenamiento General ---
  replay_buffer_size: 8000000   # Capacidad del buffer de repetición (8 millones de transiciones)
  batch_size: 8192               # Tamaño del mini-batch para cada paso de aprendizaje
  min_buffer_for_learning: 500000  # Mínimo número de experiencias antes de comenzar el aprendizaje

  # --- Hiperparámetros Específicos de SAC ---
  hiperparametros_sac: # Usando un nombre un poco más específico que solo "hiperparametros"
    gamma: 0.99                   # Factor de descuento para recompensas futuras
    tau: 0.005                    # Coeficiente para la actualización suave de las redes objetivo
    
    actor_learning_rate: 0.0003   # Tasa de aprendizaje para la red del Actor (Adam optimizer)
    critic_learning_rate: 0.0003  # Tasa de aprendizaje para las redes del Crítico (Adam optimizer)
    
    learn_alpha: True             # Si alpha (temperatura de entropía) es aprendible
    alpha_learning_rate: 0.0003   # Tasa de aprendizaje para alpha (si es aprendible)
    target_entropy: 'auto'        # Entropía objetivo. 'auto' calcula como -dim_accion (recomendado)
                                  # También puedes usar un valor fijo como -1.0
    initial_log_alpha: 0.0        # Valor inicial para log(alpha), resultando en alpha=1.0. Ajustable.

  # --- Parámetros de la Arquitectura del Transformer (para StateTransformerEncoder) ---
  # Asumimos que el Transformer procesa la ventana de datos de mercado.
  # Número de características de mercado por paso de tiempo (5 OHLCV + 7 Indicadores = 12)
  # input_features_per_step_transformer: 12 (Esto se derivaría de los datos, no es un hiperparámetro a tunear tanto como una especificación de entrada)
  transformer:
    d_model: 128                  # Dimensión interna del Transformer (embeddings).
    n_head: 4                     # Número de cabezales de atención (d_model debe ser divisible por n_head; 128/4=32).
    num_encoder_layers: 3         # Número de capas de Encoder de Transformer apiladas (2-4 es un buen inicio).
    dim_feedforward: 256          # Dimensión de la capa oculta en la FFN del Transformer (ej. 2*d_model).
    dropout_rate: 0.1             # Tasa de dropout dentro del Transformer.
  
  # --- Parámetros de las Cabezas MLP (para Actor y Crítico después del Transformer) ---
  # La entrada a estas MLP será la salida del Transformer (d_model) 
  # concatenada con las características escalares del portafolio (asumimos 4: tipo_pos, pnl_norm, pasos_norm, entrada_norm).
  # Input_dim_mlp = d_model (128) + num_portfolio_features (4) = 132
  mlp_heads:
    hidden_dims: [256, 256]       # Lista de dimensiones para las capas ocultas de las MLP del Actor y Crítico.
                                  # Ej: [256, 256] significa dos capas ocultas de 256 neuronas cada una.

  # --- Frecuencia de Entrenamiento ---
  learning_frequency: 16         # Aprender cada N pasos
  update_target_frequency: 2    # Actualizar redes objetivo cada N pasos de aprendizaje
  
  # --- Parámetros de Guardado y Carga ---
  model_save_frequency: 10000   # Guardar modelo cada N pasos
  models_directory: "models/agent"  # Directorio para guardar modelos