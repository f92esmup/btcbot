# Configuración centralizada para todo el proyecto BTCBot

# =====================================================================
# Configuración de Rutas y Acceso a Datos
# =====================================================================
data_paths:
  # Rutas para Google Cloud Storage (obligatorias)
  gcs_models: "models"  # Directorio para guardar modelos en GCS
  gcs_processed_sequences: "data/processed_sequences"  # Chunked processed sequences
  gcs_best_model: "models/best_sac_model.zip"  # Single best model path

# =====================================================================
# Configuración de la API de Binance
# =====================================================================
binance_api:
  futures_base_url: "https://fapi.binance.com"
  request_limit_per_call: 1000
  request_delay_seconds: 0.5
  retry_attempts: 5
  retry_delay_seconds: 60

# =====================================================================
# Configuración de Adquisición de Datos
# =====================================================================
data_acquisition_defaults:
  symbol: "BTCUSDT"
  interval: "1m"
  historical_start_date: "2025-02-01"  # Fecha modificada para procesar un chunk pequeño

# =====================================================================
# Configuración de Preprocesamiento de Datos
# =====================================================================
preprocessing:
  # Longitud de la secuencia para el Transformer
  sequence_length_L: 96

  # Multiplicador para la ventana de normalización Z-score (ventana = L * multiplicador)
  normalization_window_multiplier_for_L: 2

  # Optimizaciones de rendimiento y almacenamiento
  use_float32: true  # Usar float32 en lugar de float64 para reducir uso de memoria
  use_parquet_storage: true  # Guardar también en formato Parquet para mejor compresión y velocidad

  # Integrated data pipeline configuration
  chunk_duration_months: 1  # Process data in monthly chunks (modificado para pruebas)
  required_buffer_periods: 100  # Minimum periods needed for indicators and normalization (reducido para pruebas)

  # Parámetros para el procesamiento de OHLCV
  ohlcv_processing:
    volume_sma_period: 20

  # Parámetros para los indicadores técnicos
  indicators:
    sma_short_period: 20
    sma_long_period: 50
    ema_short_period: 12
    ema_long_period: 26
    rsi_period: 14
    rsi_scaling_mode: "0_1" # "0_1" o "-1_1"
    atr_period: 14
    macd_fast_period: 12
    macd_slow_period: 26
    macd_signal_period: 9
    bollinger_period: 20
    bollinger_std_dev: 2
    cci_period: 20
    stochastic_k_period: 14 # k en pandas_ta
    stochastic_d_period: 3  # d en pandas_ta
    stochastic_slowing_period: 3 # smooth_k en pandas_ta

  # Lista de características de mercado finales a incluir en las secuencias (el orden importa)
  # Estos nombres deben coincidir con las columnas generadas después de la ingeniería y normalización.
  final_market_feature_columns:
    - 'log_ret_C_O_norm'
    - 'log_ret_H_O_norm'
    - 'log_ret_L_O_norm'
    - 'log_ret_C_C_prev_norm'
    - 'log_ret_Vol_SMAVol_norm'
    - 'SMA_short_norm'          # Ej. (SMA_short - Close) / ATR
    - 'SMA_long_norm'           # Ej. (SMA_long - Close) / ATR
    - 'EMA_short_norm'          # Ej. (EMA_short - Close) / ATR
    - 'EMA_long_norm'           # Ej. (EMA_long - Close) / ATR
    - 'RSI_scaled'              # Ej. RSI / 100
    - 'ATR_norm'                # Ej. ATR / Close
    - 'MACD_line_norm'          # Ej. MACD_line / ATR o Z-score
    - 'MACD_signal_norm'        # Ej. MACD_signal / ATR o Z-score
    - 'MACD_hist_norm'          # Ej. MACD_hist / ATR o Z-score
    - 'BB_dist_upper_norm'      # Ej. (BB_upper - Close) / ATR

# =====================================================================
# Configuración del Entorno de Trading
# =====================================================================
environment:
  # --- Configuración General del Entorno ---
  env_id: "FuturesTradingEnv-v0" # Identificador para registrar en Gymnasium
  initial_equity: 10000.0       # Equity inicial para cada episodio (USDT)
  max_episode_steps_use_dataset_length: true # Si true, max_steps = len(dataset) - L
  allow_random_episode_start: true # Para el entrenamiento, empezar en puntos aleatorios del dataset

  # --- Configuración de Trading y Cartera ---
  leverage: 10.0
  position_size_pct_equity: 0.05 # 5% del equity actual para el tamaño nocional
  taker_fee_rate: 0.0004         # Comisión de Taker (0.04%)
  slippage_atr_multiplier: 0.1   # Multiplicador de ATR(14) para el slippage (por lado)
  min_order_size_btc: 0.001      # Mínimo tamaño de orden en BTC (o la unidad base)

  # --- Lógica de Acción del Agente ---
  action_threshold: 0.15    # Umbral para interpretar la señal continua del agente

  # --- Lógica de Finalización de Episodio y Liquidación ---
  equity_drawdown_threshold_episode_end: -0.20 # -20% drawdown del equity inicial del episodio
  liquidation_safety_factor: 0.8 # (1 / leverage) * safety_factor = % de movimiento para liquidación

  # --- Características de Observación (Portfolio) ---
  # Parámetros para la normalización de las características de la cartera, si se hace dentro del entorno
  portfolio_features_normalization:
    max_steps_in_position: 288 # ej. L * 3 (para normalizar 'steps_in_current_position')

  # --- Carga de Datos de Mercado (del Módulo 2) ---
  # Updated to use new integrated data pipeline
  processed_sequences_directory: "data/processed_sequences"  # Directory in GCS for chunked sequences
  processed_sequence_file_pattern: "*_L{sequence_length}_sequences_*.npz"  # Pattern to match sequence files

# =====================================================================
# Configuración del Agente RL
# =====================================================================
agent:
  # --- Configuración del Algoritmo SAC (para Stable Baselines3) ---
  algorithm: "SAC"
  learning_rate: 0.0003
  buffer_size: 100000
  learning_starts: 10000      # Pasos para llenar el buffer antes de entrenar
  batch_size: 256
  tau: 0.005                  # Coeficiente de actualización suave para redes objetivo
  gamma: 0.99                 # Factor de descuento
  train_freq: 1               # Frecuencia de entrenamiento (en pasos de entorno, ej., (1, "step"))
  gradient_steps: 1           # Pasos de gradiente por actualización
  ent_coef: "auto"            # Aprendizaje automático del coeficiente de entropía alpha
  use_sde: false              # State-Dependent Exploration (SAC ya es estocástico)

  # --- Configuración de la Arquitectura de Red Personalizada (para policy_kwargs en SB3) ---
  policy_kwargs:
    features_extractor_class: "CustomTransformerFeatureExtractor" # Nombre de tu clase extractor
    features_extractor_kwargs:
      market_features_key: "market_features"
      portfolio_features_key: "portfolio_features"
      # N_features_mercado = 15, N_features_cartera = 8 => N_features_entrada_transformer = 23
      features_in_transformer: 23 # 15 (mercado) + 8 (cartera)
      d_model: 128
      n_heads: 4
      n_encoder_layers: 3
      dim_feedforward: 512 # d_model * 4
      dropout_rate: 0.1

    # Arquitectura de las redes MLP del actor (pi) y crítico (qf) DESPUÉS del extractor
    net_arch:
      pi: [256, 256] # Capas ocultas para el actor
      qf: [256, 256] # Capas ocultas para los críticos

  # --- Configuración de Entrenamiento ---
  total_training_timesteps: 1000000
  log_interval_episodes: 10 # Loguear cada N episodios
  
  # Best model only strategy - simplified model management
  best_model_path: "models/best_sac_model.zip"  # Single best model path in GCS
  enable_best_model_only: true  # Use simplified "best model only" strategy
  best_model_evaluation_frequency: 10000  # Evaluate and potentially update best model every N steps
  
  # Model storage configuration
  gcs_models_path_prefix: "models/sac_transformer_trading_agent"  # Base path for all models in GCS
  save_frequency_steps: 100000  # Save frequency for training checkpoints
  
  use_gpu: true  # Activar para usar GPU (CUDA/MPS) si está disponible

  # --- Configuración adicional para el guardado de modelos ---
  save_final_model: true  # Guardar el modelo final al completar el entrenamiento
  save_best_model: true   # Guardar el mejor modelo durante la evaluación
  keep_all_checkpoints: false  # Mantener todos los checkpoints (no sobrescribir)

  # --- Configuración de Logging para BigQuery en Entrenamiento ---
  bigquery_logging:
    # Los datos se guardan localmente en CSV durante entrenamiento y se suben a BigQuery al finalizar
    training_metrics_log_interval_steps: 100 # Intervalo de pasos para loguear métricas de entrenamiento (pérdidas, lr)

# =====================================================================
# Configuración de Trading en Vivo
# =====================================================================
live_trading:  
  # URLs de WebSocket para diferentes modos de trading
  websocket_urls:
    testnet: "wss://stream.binancefuture.com/ws"
    real: "wss://fstream.binance.com/ws"
  
  # Número de velas a descargar para el preprocesamiento en cada ciclo de decisión
  # Debe ser suficiente para las ventanas de normalización e indicadores.
  # Ej: Si L=96 y normalization_window_multiplier_for_L=2, la ventana de normalización es 192.
  # Necesitarás al menos 192 velas + (periodos de indicadores más largos) para que la última vela tenga features normalizadas válidas.
  market_data_lookback_candles: 1000 # Ajustar según sea necesario
  
  # Configuración para BigQuery (logging directo de eventos de trading)
  bigquery_dataset_id: "btcbot_logs"        # Dataset de BigQuery para logs de trading
  bigquery_table_name: "live_trading_events" # Nombre de la tabla para eventos de trading

  # Segundos a esperar entre reintentos de conexión del WebSocket si falla
  websocket_retry_delay_seconds: 10
  # Segundos a esperar antes de reintentar el ciclo principal si ocurre un error inesperado
  websocket_unexpected_error_delay_seconds: 30

  # Configuración para la disponibilidad de la última kline en la API REST
  # A veces, después de que el WebSocket notifica el cierre, la API REST puede tardar un instante en tenerla.
  kline_availability_retry_delay_seconds: 5  # Segundos de espera entre reintentos
  kline_availability_max_retries: 12         # Máximo número de reintentos (ej. 12 * 5s = 1 minuto)

  # Pequeña pausa opcional en segundos después de cerrar una posición antes de evaluar abrir una nueva.
  post_close_delay_seconds: 1

  # Configuración para el logging en CSV a GCS (legacy, se mantiene por compatibilidad)
  gcs_log_path_template: "live_trading_logs/{symbol}_{interval}/{date}.csv" # {symbol}, {interval}, {date} serán reemplazados
  log_buffer_size_records: 50    # Número de registros a acumular antes de subir a GCS
  gcs_log_upload_interval_seconds: 3600 # Intervalo máximo en segundos para subir logs (ej. 1 hora)

# =====================================================================
# Configuración de Testing y Desarrollo
# =====================================================================
testing:
  # Configuración para scripts de testing
  default_test_symbol: "BTCUSDT"
  default_test_interval: "15m"
  default_test_lookback_candles: 100
  
  # Configuración para validación de integración
  api_timeout_seconds: 30
  max_test_retries: 3
  
  # Configuración para pruebas de datos
  sample_data_size: 1000  # Número de registros para pruebas
  test_date_range_days: 7  # Días de datos para testing
