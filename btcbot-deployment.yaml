# btcbot-deployment.template.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: btcbot-live-trader
  labels:
    app: btcbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: btcbot-trader
  template:
    metadata:
      labels:
        app: btcbot-trader
    spec:
      # Si usas Workload Identity, especifica aquí tu Kubernetes Service Account (KSA)
      # serviceAccountName: tu-ksa-nombre
      containers:
      - name: btcbot-runner
        image: europe-southwest1-docker.pkg.dev/lofty-complex-460416-r6/lofty-complex-460416-r6-repo/btcbot-cpu:latest # Asegúrate que esta es tu imagen correcta
        command: ["python", "scripts/run_live_trader.py"]
        args: ["--config_path", "src/config.yaml"]
        env:
        # --- Variables de Configuración de GCP ---
        - name: GCP_PROJECT_ID
          value: "lofty-complex-460416-r6"
        - name: GCS_BUCKET_NAME
          value: "lofty-complex-460416-r6"
        - name: GCP_REGION
          value: "europe-southwest1"

        # --- Variables de Configuración del Bot ---
        - name: LIVE_TRADING_MODE # "TESTNET" o "REAL"
          value: "TESTNET"

        # --- Nombres de los Secretos en Google Cloud Secret Manager ---
        # Tu código usará estos NOMBRES para buscar los valores reales en Secret Manager
        - name: SECRET_NAME_BINANCE_API_KEY_FUTURES
          value: "BINANCE_API_KEY_FUTURES" # Este es el nombre del secreto, no el valor
        - name: SECRET_NAME_BINANCE_API_SECRET_FUTURES
          value: "BINANCE_API_SECRET_FUTURES" # Este es el nombre del secreto, no el valor
        - name: SECRET_NAME_TESTNET_BINANCE_API_KEY_FUTURES
          value: "TESTNET_BINANCE_API_KEY_FUTURES" # Este es el nombre del secreto, no el valor
        - name: SECRET_NAME_TESTNET_BINANCE_API_SECRET_FUTURES
          value: "TESTNET_BINANCE_API_SECRET_FUTURES" # Este es el nombre del secreto, no el valor
        resources:
          requests:
            cpu: "200m"      # 0.2 CPU cores (mínimo requerido en Autopilot)
            memory: "512Mi"  # 512MB de memoria (reducido del valor predeterminado)
          limits:
            cpu: "500m"      # Máximo 0.5 CPU cores
            memory: "1Gi"    # Máximo 1GB de memoria

