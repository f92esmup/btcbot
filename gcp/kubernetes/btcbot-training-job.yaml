apiVersion: batch/v1
kind: Job
metadata:
  name: btcbot-training-job
  namespace: btcbot
spec:
  ttlSecondsAfterFinished: 3600  # Elimina el Job 1 hora después de completarse
  template:
    spec:
      serviceAccountName: btcbot-inference-sa  # Reutiliza la SA existente que tiene permisos para GCS
      nodeSelector:
        accelerator: nvidia-tesla-t4  # Asegura que se programe en nodos con GPU T4
      # Descomentar estas toleraciones si tus nodos GPU tienen taints
      # tolerations:
      # - key: "gpu-workload"
      #   operator: "Equal"
      #   value: "true"
      #   effect: "NoSchedule"
      containers:
      - name: training-container
        image: europe-southwest1-docker.pkg.dev/lofty-complex-460416-r6/lofty-complex-460416-r6-repo/btcbot-gpu:latest
        command: ["python", "scripts/train_rl_agent.py"]
        args:
          - "--config"
          - "src/config.yaml"
          - "--timesteps"
          - "100000"  # Ajustar según necesidades
        env:
        - name: GCP_PROJECT_ID
          value: "lofty-complex-460416-r6"
        - name: GCS_BUCKET_NAME
          value: "lofty-complex-460416-r6_data"
        - name: GCP_REGION
          value: "europe-southwest1"
        resources:
          limits:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          requests:
            memory: "8Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
      restartPolicy: Never  # No reintentar el Pod si falla
  backoffLimit: 0  # El Job no se reintentará
