# ---------------------------------------------------------------------------
# vertexaimultiple.yaml: Plantilla Maestra para Entrenamiento Distribuido
# ---------------------------------------------------------------------------
#
# Autor: Pedro Escudero Murcia
# Descripción:
#   Este archivo de configuración está diseñado para lanzar trabajos de
#   entrenamiento distribuido en Vertex AI para el proyecto btcbot.
#   Es una plantilla flexible que permite escalar el entrenamiento
#   a múltiples máquinas y/o múltiples GPUs por máquina.
#
# CÓMO USAR ESTE ARCHIVO:
# 1. Modifica los parámetros en la sección `args` para tu experimento.
# 2. Para escalar a más máquinas, aumenta el `replicaCount` en el "Pool 1: Workers".
# 3. Para usar más GPUs por máquina, aumenta el `acceleratorCount` y descomenta
#    y ajusta la línea `command` que usa "torchrun".
#
# ---------------------------------------------------------------------------

workerPoolSpecs:
  # --- Pool 0: El "Master" o Jefe (RANK 0) ---
  # Vertex AI exige que este primer pool (el "maestro") tenga siempre `replicaCount: 1`.
  # Este nodo será el responsable de las tareas de gestión (guardar checkpoints, logs, etc.).
  - machineSpec:
      machineType: 'n1-standard-8'      # Tipo de máquina para el jefe.
      acceleratorType: 'NVIDIA_TESLA_T4'  # Tipo de GPU.
      acceleratorCount: 1               # GPUs para esta máquina (normalmente 1 para el jefe).
    
    replicaCount: 1 # ¡NO CAMBIAR! El pool maestro siempre debe tener 1 réplica.
    
    containerSpec:
      imageUri: 'europe-southwest1-docker.pkg.dev/btcbot-461022/btcbotrepo/btcbot-train-gpu:latest'
      command: ["torchrun", "--nproc_per_node=1", "train.py"]
      args:
        - '--symbol=BTCUSDT'
        - '--interval=1h'
        - '--start-date=2025-01-01'
        - '--episodes=10'
        - '--eval-frequency=6'
        - '--save-frequency=8'

  # --- Pool 1: Los "Workers" (RANK 1 en adelante) ---
  # Aquí es donde ocurre la magia del escalado. Aumenta el `replicaCount`
  # para añadir más máquinas a tu clúster de entrenamiento.
  - machineSpec:
      machineType: 'n1-standard-8'      # Tipo de máquina para los trabajadores.
      acceleratorType: 'NVIDIA_TESLA_T4'  # Debe ser el mismo tipo de GPU.
      
      # --- INSTRUCCIÓN 1: ESCALADO DE GPUs POR MÁQUINA ---
      # Cambia este valor para asignar más GPUs a CADA máquina trabajadora.
      # Si cambias a un valor > 1, DEBES usar "torchrun" en el `command` de abajo.
      acceleratorCount: 1

    # --- INSTRUCCIÓN 2: ESCALADO DE MÁQUINAS ---
    # Este es el número de máquinas trabajadoras que quieres añadir al jefe.
    # Ejemplos:
    #   - Para 2 máquinas en total (1 jefe + 1 trabajador), usa `replicaCount: 1`.
    #   - Para 5 máquinas en total (1 jefe + 4 trabajadores), usa `replicaCount: 4`.
    #   - Para 9 máquinas en total (1 jefe + 8 trabajadores), usa `replicaCount: 8`.
    replicaCount: 1 # Para un total de 1 (jefe) + 1 (trabajador) = 2 máquinas.
    
    containerSpec:
      imageUri: 'europe-southwest1-docker.pkg.dev/btcbot-461022/btcbotrepo/btcbot-train-gpu:latest'
      
      # --- INSTRUCCIÓN 3: COMANDO DE EJECUCIÓN ---
      # - Si `acceleratorCount` es 1 (como ahora), usa el comando simple.
      command: ["torchrun", "--nproc_per_node=1", "train.py"]
      
      # - Si `acceleratorCount` es > 1 (p. ej., 2), COMENTA la línea de arriba y
      #   DESCOMENTA Y USA la siguiente, ajustando el número en `nproc_per_node`.
      # command: ["torchrun", "--nproc_per_node=2", "train.py"]
      
      args:
        # Los argumentos deben ser idénticos a los del pool maestro.
        - '--symbol=BTCUSDT'
        - '--interval=1h'
        - '--start-date=2025-01-01'
        - '--episodes=10'
        - '--eval-frequency=6'
        - '--save-frequency=8'

# --- Configuración de Servicio y Permisos ---
# La cuenta de servicio que tiene los permisos necesarios para acceder a GCS,
# Artifact Registry, Secret Manager y Vertex AI.
serviceAccount: 'btcbot-training-sa@btcbot-461022.iam.gserviceaccount.com'