apiVersion: batch/v1
kind: Job
metadata:
  name: pipeline-orchestrator
  namespace: btcbot
spec:
  template:
    spec:
      serviceAccountName: btcbot-ksa
      restartPolicy: OnFailure
      containers:
      - name: orchestrator
        image: bitnami/kubectl:latest
        command: ["/bin/bash"]
        args:
        - -c
        - |
          echo "Starting data pipeline orchestration..."
          
          # Función para esperar a que un job termine
          wait_for_job() {
            local job_name=$1
            echo "Waiting for job $job_name to complete..."
            kubectl wait --for=condition=complete job/$job_name --timeout=3600s -n btcbot
            if [ $? -eq 0 ]; then
              echo "Job $job_name completed successfully"
              return 0
            else
              echo "Job $job_name failed or timed out"
              return 1
            fi
          }
          
          # Ejecutar adquisición de datos (manual trigger del cronjob)
          echo "Creating data acquisition job from cronjob..."
          kubectl create job data-acquisition-manual --from=cronjob/data-acquisition-cronjob -n btcbot
          wait_for_job "data-acquisition-manual" || exit 1
          
          # Ejecutar preprocesamiento
          echo "Starting data preprocessing..."
          kubectl delete job data-preprocessing-job -n btcbot --ignore-not-found=true
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: data-preprocessing-job-$(date +%Y%m%d-%H%M%S)
            namespace: btcbot
          spec:
            template:
              spec:
                serviceAccountName: btcbot-ksa
                restartPolicy: OnFailure
                containers:
                - name: data-preprocessing
                  image: europe-southwest1-docker.pkg.dev/lofty-complex-460416-r6/lofty-complex-460416-r6-repo/btcbot-cpu:latest
                  command: ["python", "scripts/preprocess_data.py"]
                  envFrom:
                  - configMapRef:
                      name: btcbot-env-vars
                  resources:
                    requests:
                      memory: "2Gi"
                      cpu: "1000m"
                    limits:
                      memory: "4Gi"
                      cpu: "2000m"
                nodeSelector:
                  kubernetes.io/arch: amd64
          EOF
          wait_for_job "data-preprocessing-job-$(date +%Y%m%d-%H%M%S)" || exit 1
          
          # Ejecutar entrenamiento
          echo "Starting model training..."
          kubectl delete job model-training-job -n btcbot --ignore-not-found=true
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: model-training-job-$(date +%Y%m%d-%H%M%S)
            namespace: btcbot
          spec:
            template:
              spec:
                serviceAccountName: btcbot-ksa
                restartPolicy: OnFailure
                containers:
                - name: model-training
                  image: europe-southwest1-docker.pkg.dev/lofty-complex-460416-r6/lofty-complex-460416-r6-repo/btcbot-gpu:latest
                  command: ["python", "scripts/train_rl_agent.py"]
                  envFrom:
                  - configMapRef:
                      name: btcbot-env-vars
                  resources:
                    requests:
                      memory: "4Gi"
                      cpu: "2000m"
                      nvidia.com/gpu: "1"
                    limits:
                      memory: "8Gi"
                      cpu: "4000m"
                      nvidia.com/gpu: "1"
                nodeSelector:
                  kubernetes.io/arch: amd64
                  cloud.google.com/gke-accelerator: nvidia-tesla-t4
          EOF
          wait_for_job "model-training-job-$(date +%Y%m%d-%H%M%S)" || exit 1
          
          echo "Pipeline completed successfully!"
        envFrom:
        - configMapRef:
            name: btcbot-env-vars
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
      nodeSelector:
        kubernetes.io/arch: amd64
