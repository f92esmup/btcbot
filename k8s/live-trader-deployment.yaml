apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-trader-deployment
  namespace: btcbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: live-trader
  template:
    metadata:
      labels:
        app: live-trader
    spec:
      serviceAccountName: btcbot-ksa
      containers:
      - name: live-trader
        image: europe-southwest1-docker.pkg.dev/lofty-complex-460416-r6/lofty-complex-460416-r6-repo/btcbot-cpu:latest
        command: ["python", "scripts/run_live_trader.py"]
        envFrom:
        - configMapRef:
            name: btcbot-env-vars
        env:
        - name: LIVE_TRADING_MODE
          value: "true"  # Override para trading en vivo
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep 'python scripts/run_live_trader.py' | grep -v grep"
          initialDelaySeconds: 30
          periodSeconds: 60
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep 'python scripts/run_live_trader.py' | grep -v grep"
          initialDelaySeconds: 10
          periodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: amd64
