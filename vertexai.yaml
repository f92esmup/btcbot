# vertexai.yaml
# Configuration for a Vertex AI Custom Training Job for btcbot with GPU

# workerPoolSpecs: Defines the configuration for the worker pool(s).
# For single-GPU training, one worker pool is usually sufficient.
workerPoolSpecs:
  - machineSpec:
      # machineType: Specifies the type of machine for the training worker.
      # Choose a machine type appropriate for your workload and GPU.
      # e.g., n1-standard-4, n1-standard-8.
      # See: https://cloud.google.com/vertex-ai/docs/training/configure-compute#machine-types
      machineType: 'n1-standard-8' # 8 vCPUs, 30 GB RAM - adjust if needed

      # acceleratorType: Specifies the type of GPU.
      # For NVIDIA T4, use 'NVIDIA_TESLA_T4'.
      # Ensure this accelerator is available in your chosen region (europe-west4).
      acceleratorType: 'NVIDIA_TESLA_T4'

      # acceleratorCount: The number of GPUs to attach to the machine.
      acceleratorCount: 1
    
    # replicaCount: The number of worker replicas in this pool.
    # For single-machine training, this is 1.
    replicaCount: 1
    
    # containerSpec: Defines the Docker container to run on the workers.
    containerSpec:
      # imageUri: The URI of your custom Docker image in Artifact Registry.
      # This should be the GPU-enabled image (e.g., btcbot-train-gpu:latest).
      # Replace placeholders with your actual values if not using a CI/CD substitution system.
      imageUri: 'europe-southwest1-docker.pkg.dev/btcbot-461022/btcbotrepo/btcbot-train-gpu:latest'
      
      # args: Arguments to pass to the ENTRYPOINT of your Docker container (train.py).
      # Ensure these match the arguments expected by your train.py script.
      args:
        - '--symbol=BTCUSDT'
        - '--interval=15m'
        - '--start-date=2023-01-01' # Example start date
        - '--episodes=2000'         # Example number of episodes
        - '--eval-frequency=100'
        - '--save-frequency=50'
        - '--eval-episodes=1'
#        - '--checkpoint=BTCUSDT_1h_73_20250625-173818' # <-- El run_id que anotaste antes
#        - '--fine-tune-mode' # <-- ¡Aquí está la diferencia!
        # IMPORTANT: Do NOT include '--no-cuda' if you want to use the GPU.
        # Your train.py script's setup_device() function will detect and use the GPU.

      # command: If your Docker image's ENTRYPOINT is not directly your training script
      # (e.g., if ENTRYPOINT is just 'python'), you might specify the script here.
      # Since ENTRYPOINT is 'python train.py', this can often be omitted or empty.
      # command: ["python", "train.py"] # This is redundant if already in Dockerfile ENTRYPOINT

# serviceAccount: Specify the service account for the job.
# This service account has the necessary permissions for:
# - Reading from Artifact Registry (roles/artifactregistry.reader)
# - Reading/writing to GCS buckets (roles/storage.objectAdmin)
# - Accessing Google Cloud Secret Manager (roles/secretmanager.secretAccessor)
# - Writing to Cloud Logging (roles/logging.logWriter)
# - Using Vertex AI services (roles/aiplatform.user)
serviceAccount: 'btcbot-training-sa@btcbot-461022.iam.gserviceaccount.com'

# baseOutputDirectory: (Optional)
# If you want Vertex AI to manage output artifacts and provide environment variables
# like AIP_MODEL_DIR, AIP_CHECKPOINT_DIR, AIP_TENSORBOARD_LOG_DIR.
# Your current train.py script seems to manage its own GCS paths via config.yaml and gcs_utils.py,
# so this might not be strictly necessary unless you adapt your script to use these env vars.
# If used, ensure the service account has write access to this GCS prefix.
# baseOutputDirectory:
#   outputUriPrefix: 'gs://btcbot-training-ew4/vertex-ai-outputs/' # Must be your GCS bucket
